name: Application Insights reports

on:
  schedule:
    - cron: "30 7 * * *" # Every day at 07:30 UTC (08:30 Europe/London during BST)
  workflow_dispatch:

jobs:
  service-unavailable-page-views:
    environment: azure-prod
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Get report date
        id: report-date
        run: |
          echo "date=$(TZ=Europe/London date -d 'yesterday' +'%A %d-%m-%Y')" >> "$GITHUB_OUTPUT"

      - name: Read query
        id: query
        run: |
          {
            echo 'query<<EOF'
            cat azure-queries/service-unavailable-page-views.kql
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/app-insights-to-slack
        with:
          title: Manage People on Probation - Sorry, there is a problem with the service
          summary: Number of times users saw the "Sorry, there is a problem with the service" error page on ${{ steps.report-date.outputs.date }}.
          query: ${{ steps.query.outputs.query }}
          slack_channel: manage-people-on-probation-alerts
          slack_token: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
          azure_app_id: ${{ secrets.AZURE_APPLICATION_INSIGHTS_APP_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
